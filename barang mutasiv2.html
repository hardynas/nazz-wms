<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAZZ WMS - Mutasi Barang</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased min-h-screen flex">
        
       <!-- Sidebar Navigation -->
    <aside class="w-64 bg-[#0F172A] text-slate-300 flex flex-col justify-between hidden md:flex flex-shrink-0 no-print min-h-screen border-r border-slate-800">
        <div>
            <!-- Logo Section -->
            <div class="p-5 flex items-center gap-3 border-b border-slate-800">
                <div class="bg-blue-600 text-white font-black px-2.5 py-1.5 rounded-lg text-sm tracking-wider">
                    WMS
                </div>
                <span class="text-xl font-extrabold tracking-tight text-white">NAZZ<span class="text-blue-500">WMS</span></span>
            </div>

            <!-- Menu Navigation -->
            <nav class="p-4 space-y-6 text-sm">
                <div>
                  <div class="px-3 mb-2 text-[11px] font-bold text-slate-500 uppercase tracking-wider">MENU UTAMA</div>
                    <div class="space-y-1">
                        <button onclick="switchTab('so')" id="btn-tab-so" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800/60 font-medium text-sm transition">
                            <i class="fa-solid fa-boxes-stacked text-base"></i> Stock Opname Perangkat
                        </button>
                        <button onclick="switchTab('mutasi')" id="btn-tab-mutasi" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-white bg-blue-600/90 font-medium text-sm transition shadow-sm shadow-blue-600/20 text-left">
                            <a href="barang mutasiv2.html" class="flex items-center gap-3 w-full">
                                <i class="fa-solid fa-right-left text-base"></i> Barang Masuk / Keluar
                            </a>
                        </button>
                        <!-- MENU: Cetak Label Barcode -->
                        <button onclick="switchTab('cetak-label')" id="btn-tab-cetak-label" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800/60 font-medium text-sm transition text-left">
                            <a href="regenerate v2.html" class="flex items-center gap-3 w-full">
                                <i class="fa-solid fa-barcode text-base"></i> Cetak Label Barcode
                            </a>
                        </button>
                    </div>
                </div>
            </nav>
        </div>

        <!-- User Profile Footer -->
        <div class="p-4 border-t border-slate-800/80 flex items-center gap-3 bg-slate-900/40">
            <div class="w-9 h-9 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-xs shadow-inner">HD</div>
            <div class="overflow-hidden">
                <p class="text-sm font-semibold text-white leading-tight truncate">Hardynas</p>
                <p class="text-[11px] text-slate-400 truncate">Auditor / Field Tech</p>
            </div>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 p-6 lg:p-8 overflow-y-auto">
        <div class="max-w-6xl mx-auto space-y-6">
            <!-- Header Bar -->
            <header class="flex justify-between items-center bg-white p-4 px-6 rounded-2xl shadow-sm border border-slate-200/80">
                <div class="flex items-center gap-3.5">
                    <a href="index.html" class="bg-slate-100 hover:bg-slate-200 text-slate-600 hover:text-slate-900 p-2.5 rounded-xl transition-all flex items-center justify-center w-10 h-10">
                        <i class="fa-solid fa-arrow-left text-sm"></i>
                    </a>
                    <div>
                        <h1 class="text-lg font-bold text-slate-900 flex items-center gap-2">
                            <i class="fa-solid fa-right-left text-blue-600"></i> Barang Masuk / Keluar
                        </h1>
                        <p class="text-xs text-slate-500">Kelola dan catat riwayat transaksi mutasi perangkat inventaris</p>
                    </div>
                </div>
            </header>

            <!-- Form Transaksi Mutasi -->
            <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6 space-y-5">
                <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                    <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-pen-to-square text-blue-600 text-sm"></i> Input Mutasi Perangkat
                    </h2>
                </div>
                
                <form onsubmit="handleMutasi(event)" class="grid grid-cols-1 md:grid-cols-5 gap-4">
                    <div>
                        <label class="text-xs font-semibold text-slate-600 block mb-1.5">No Registrasi / SN</label>
                        <input type="text" id="m-no-reg" required placeholder="Masukkan SN Device" class="w-full border border-slate-200 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 bg-slate-50/50 focus:bg-white transition">
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-slate-600 block mb-1.5">Tipe Mutasi</label>
                        <select id="m-tipe" class="w-full border border-slate-200 rounded-xl p-2.5 text-sm bg-slate-50/50 focus:bg-white focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition">
                            <option value="MASUK">Barang Masuk (+)</option>
                            <option value="KELUAR">Barang Keluar (-)</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-slate-600 block mb-1.5">Pergerakan</label>
                        <select id="m-pergerakan" class="w-full border border-slate-200 rounded-xl p-2.5 text-sm bg-slate-50/50 focus:bg-white focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition">
                            <option value="Stock">Stock</option>
                            <option value="Gangguan">Gangguan</option>
                            <option value="Pasang Baru">Pasang Baru</option>
                            <option value="Cabutan">Cabutan</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-slate-600 block mb-1.5">Jumlah (Qty)</label>
                        <input type="number" id="m-qty" min="1" required placeholder="1" class="w-full border border-slate-200 rounded-xl p-2.5 text-sm bg-slate-50/50 focus:bg-white focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition">
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-slate-600 block mb-1.5">Keterangan / SPK</label>
                        <input type="text" id="m-ket" required placeholder="No. SPK / Tiket" class="w-full border border-slate-200 rounded-xl p-2.5 text-sm bg-slate-50/50 focus:bg-white focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition">
                    </div>
                    <div class="md:col-span-5 flex justify-end pt-2">
                        <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-semibold px-6 py-2.5 rounded-xl text-sm transition shadow-sm shadow-emerald-600/20 flex items-center gap-2">
                            <i class="fa-solid fa-floppy-disk"></i> Simpan Mutasi
                        </button>
                    </div>
                </form>
            </div>

            <!-- Tabel Riwayat Mutasi -->
            <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6 space-y-4">
                <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                    <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-clock-rotate-left text-blue-600 text-sm"></i> Riwayat Pergerakan Barang
                    </h2>
                </div>
                <div class="overflow-x-auto rounded-xl border border-slate-200/70">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-50 text-slate-600 border-b border-slate-200/80 font-semibold text-xs uppercase tracking-wider">
                            <tr>
                                <th class="p-3.5">Waktu</th>
                                <th class="p-3.5">SN Device</th>
                                <th class="p-3.5">Tipe</th>
                                <th class="p-3.5">Pergerakan</th>
                                <th class="p-3.5">Qty</th>
                                <th class="p-3.5">Keterangan</th>
                            </tr>
                        </thead>
                        <tbody id="table-mutasi-body" class="divide-y divide-slate-100 text-slate-700"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="mutasi.js"></script>
</body>
</html>
