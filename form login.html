<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAZZ WMS - LOGIN</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 40%, #c026d3 100%);
            min-height: 100vh;
        }

        /* Glassmorphism Card Style */
        .glass-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.25);
        }

        /* Glass Input Style */
        .glass-input {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #ffffff;
            transition: all 0.3s ease;
        }

        .glass-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .glass-input:focus {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.5);
            outline: none;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        /* Checkbox Custom Style */
        .custom-checkbox {
            appearance: none;
            background-color: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            width: 1.1rem;
            height: 1.1rem;
            border-radius: 0.25rem;
            display: grid;
            place-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .custom-checkbox:checked {
            background-color: #3b82f6;
            border-color: #3b82f6;
        }

        .custom-checkbox:checked::before {
            content: "✓";
            color: white;
            font-size: 0.75rem;
            font-weight: bold;
        }

        /* Button Gradient Style */
        .btn-gradient {
            background: linear-gradient(90deg, #3b82f6 0%, #06b6d4 100%);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }

        .btn-gradient:hover {
            opacity: 0.95;
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
            transform: translateY(-1px);
        }

        .btn-gradient:active {
            transform: translateY(1px);
        }

        /* Subtle background floating shapes for dynamic visual effect */
        .bg-shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            animation: float 8s ease-in-out infinite alternate;
        }

        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(-20px) scale(1.05); }
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 relative overflow-hidden">

    <div class="bg-shape w-72 h-72 bg-blue-500 top-10 left-10 opacity-40"></div>
    <div class="bg-shape w-96 h-96 bg-purple-600 bottom-10 right-10 opacity-40" style="animation-delay: -4s;"></div>

    <div class="glass-card w-full max-w-md rounded-3xl p-8 sm:p-10 z-10 relative">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl sm:text-4xl font-bold text-white tracking-tight mb-2">Welcome Back</h1>
            <p class="text-purple-100/80 text-sm sm:text-base font-normal">Sign in to your account</p>
        </div>

        <!-- Notification / Alert Message Container -->
        <div id="toast" class="hidden mb-6 p-3 rounded-xl text-sm font-medium text-center transition-all duration-300"></div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
            
            <!-- Email Field -->
            <div>
                <label for="email" class="block text-xs font-medium text-purple-100/80 mb-1.5 ml-1">Email Address</label>
                <div class="relative">
                    <input 
                        type="email" 
                        id="email" 
                        required 
                        placeholder="Enter your email" 
                        class="glass-input w-full px-4 py-3.5 rounded-xl text-sm placeholder-purple-200/50 focus:outline-none"
                    >
                </div>
            </div>

            <!-- Password Field -->
            <div>
                <label for="password" class="block text-xs font-medium text-purple-100/80 mb-1.5 ml-1">Password</label>
                <div class="relative flex items-center">
                    <input 
                        type="password" 
                        id="password" 
                        required 
                        placeholder="Enter your password" 
                        class="glass-input w-full px-4 py-3.5 rounded-xl text-sm placeholder-purple-200/50 pr-12 focus:outline-none"
                    >
                    <button 
                        type="button" 
                        onclick="togglePassword()" 
                        class="absolute right-4 text-purple-200/70 hover:text-white transition-colors focus:outline-none"
                        aria-label="Toggle password visibility"
                    >
                        <i id="toggleIcon" class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>

            <!-- Remember Me Checkbox -->
            <div class="flex items-center justify-between pt-1">
                <label class="flex items-center space-x-2.5 cursor-pointer">
                    <input type="checkbox" id="remember" class="custom-checkbox">
                    <span class="text-xs sm:text-sm text-purple-100/90 font-normal select-none">Remember me</span>
                </label>
            </div>

            <!-- Submit Button -->
            <div class="pt-3">
                <button 
                    type="submit" 
                    id="submitBtn"
                    class="btn-gradient w-full py-3.5 rounded-xl text-white font-semibold text-sm tracking-wide focus:outline-none focus:ring-2 focus:ring-blue-400 focus:ring-offset-2 focus:ring-offset-purple-900"
                >
                    Sign In
                </button>
            </div>

            <!-- Admin Notice Section -->
            <div class="mt-8 pt-4 border-t border-white/10 text-center">
                <p class="text-xs text-purple-200/60 leading-relaxed">
                    Access limited to registered accounts.<br>Contact administrator if you need access.
                </p>
            </div>

        </form>
    </div>

    <script>
        // Toggle Password Visibility Functionality
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }

        // Show Custom Toast/Alert
        function showNotification(message, isSuccess) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.remove('hidden', 'bg-red-500/20', 'text-red-200', 'border-red-500/30', 'bg-emerald-500/20', 'text-emerald-200', 'border-emerald-500/30');
            
            if (isSuccess) {
                toast.classList.add('bg-emerald-500/20', 'text-emerald-200', 'border', 'border-emerald-500/30');
            } else {
                toast.classList.add('bg-red-500/20', 'text-red-200', 'border', 'border-red-500/30');
            }
        }

        // Form Submission Logic Simulation
        function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submitBtn');

            // Visual feedback during processing
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-80', 'cursor-not-allowed');
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Signing in...';

            // Simulate authentication process
            setTimeout(() => {
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-80', 'cursor-not-allowed');
                submitBtn.innerHTML = 'Sign In';

                if (email && password) {
                    showNotification('Sign in successful! Redirecting...', true);
                    // Standard redirection logic would be triggered here
                } else {
                    showNotification('Please fill in all required fields.', false);
                }
            }, 1200);
        }
    </script>
</body>
</html>
